<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>機器龍骨架</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <main>
      <div class="stage">
        <canvas id="skin" width="500" height="434"></canvas>
        <canvas id="overlay" width="500" height="434"></canvas>
      </div>
      <aside>
        <h1>機器龍骨架</h1>
        <section>
          <h2>動作</h2>
          <div class="row" id="poses"></div>
          <p class="hint">最高點離地 <output id="height">0</output></p>
          <div class="row">
            <button type="button" id="pause">暫停</button>
            <button type="button" id="slow" aria-pressed="false">慢動作</button>
          </div>
        </section>
        <section>
          <h2>顯示</h2>
          <label><input type="checkbox" id="show-bones" checked /> 骨頭</label>
          <label><input type="checkbox" id="show-weights" checked /> 權重</label>
          <label><input type="checkbox" id="show-skin" checked /> 皮膚</label>
        </section>
        <section>
          <h2>骨頭</h2>
          <p class="hint">點一根骨頭，只看它帶動的點：越大越不透明，代表權重越高。</p>
          <ul id="bones"></ul>
        </section>
      </aside>
    </main>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
